name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests
      - name: Run polyglot adapter tests
        run: python -m unittest discover -s polyglot-rl-adapters/tests -v
      - name: Exercise evidence-aware CLI
        run: PYTHONPATH=src python -m repo_response_judge.cli judge examples/comparison.json --format json
